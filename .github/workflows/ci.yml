name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run shell syntax checks
        run: bash -n install.sh init_vault_sync.sh sync_config_vault.sh hooks/pre-commit.sh

      - name: Run rule injection scanner tests and audit
        run: |
          python3 scripts/scan_rules.py --test
          shopt -s nullglob
          python3 scripts/scan_rules.py GEMINI.md AGENTS.md knowledge/*.md

      - name: Run pytest suite
        run: pytest -q
